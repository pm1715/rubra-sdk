<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lobeBright" cx="38%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#eab68f"/>
      <stop offset="38%" stop-color="#c2465a"/>
      <stop offset="75%" stop-color="#7a1b28"/>
      <stop offset="100%" stop-color="#3d0c12"/>
    </radialGradient>
    <radialGradient id="lobeMed" cx="38%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#c98a76"/>
      <stop offset="38%" stop-color="#a1263a"/>
      <stop offset="75%" stop-color="#63131e"/>
      <stop offset="100%" stop-color="#2e090d"/>
    </radialGradient>
    <radialGradient id="lobeDark" cx="38%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#a05f5f"/>
      <stop offset="38%" stop-color="#7a1b28"/>
      <stop offset="75%" stop-color="#4a0e15"/>
      <stop offset="100%" stop-color="#1f0609"/>
    </radialGradient>

    <radialGradient id="hole" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#3a1015"/>
      <stop offset="70%" stop-color="#150406"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <radialGradient id="holeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="166" rx="48" ry="9" fill="url(#ground)"/>

  <ellipse cx="100" cy="100" rx="95" ry="37" transform="rotate(-12 100 100)"
           fill="none" stroke="#a3792a" stroke-width="1.8" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="95" ry="37" transform="rotate(55 100 100)"
           fill="none" stroke="#a3792a" stroke-width="1.6" opacity="0.35"/>

  <g stroke-linejoin="round">
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeMed)"   stroke="#2e090d" stroke-width="0.75" opacity="0.97" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeDark)"  stroke="#1f0609" stroke-width="0.75" opacity="0.97" transform="rotate(51.4 100 100)"/>
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeDark)"  stroke="#1f0609" stroke-width="0.75" opacity="0.97" transform="rotate(102.8 100 100)"/>
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeDark)"  stroke="#1f0609" stroke-width="0.75" opacity="0.97" transform="rotate(154.2 100 100)"/>
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeMed)"   stroke="#2e090d" stroke-width="0.75" opacity="0.97" transform="rotate(205.6 100 100)"/>
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeBright)" stroke="#3d0c12" stroke-width="0.75" opacity="0.97" transform="rotate(257.0 100 100)"/>
    <ellipse cx="100" cy="80" rx="16" ry="33" fill="url(#lobeBright)" stroke="#3d0c12" stroke-width="0.75" opacity="0.97" transform="rotate(308.4 100 100)"/>
  </g>

  <circle cx="100" cy="100" r="13" fill="url(#holeShadow)"/>
  <circle cx="100" cy="100" r="9" fill="url(#hole)"/>
  <circle cx="100" cy="100" r="9" fill="none" stroke="#a3792a" stroke-width="0.8" opacity="0.55"/>
